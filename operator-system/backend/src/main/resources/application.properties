spring.application.name=accident-reporting

# Database configuration — values are read from environment variables where possible.
# Fill these env vars with your Aiven MySQL connection details.

# Recommended env vars:
# - JDBC_DATABASE_URL: full JDBC URL, e.g. jdbc:mysql://host:3306/dbname?sslMode=REQUIRED
# - JDBC_DATABASE_USERNAME
# - JDBC_DATABASE_PASSWORD
# - JPA_DDL_AUTO (optional): e.g. update, validate, none. Defaults to 'update' here for non-destructive schema updates.

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/accident_reporting?serverTimezone=UTC}
spring.datasource.username=${JDBC_DATABASE_USERNAME:root}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# If your Aiven service requires TLS/CA verification, include the appropriate options in JDBC_DATABASE_URL.
# Example:
# JDBC_DATABASE_URL=jdbc:mysql://<host>:<port>/<db>?sslMode=VERIFY_CA&requireSSL=true&verifyServerCertificate=true
# You may also need to provide the CA certificate to the JVM via
# -Djavax.net.ssl.trustStore=/path/to/truststore.jks -Djavax.net.ssl.trustStorePassword=changeit

# Ensure Hibernate can determine the dialect even if JDBC metadata is unavailable at startup
jakarta.persistence.jdbc.url=${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/accident_reporting?serverTimezone=UTC}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect